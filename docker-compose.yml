# Self-hosting with Docker Compose:
#   cp .env.example .env   # set at least OPENRUN_PASSWORD
#   docker compose up -d   # http://localhost:8000 (put a TLS reverse proxy in front on a server)
# Uses the published image; `docker compose build` builds it from this repository instead.
services:
  openrun:
    image: ghcr.io/mandel2000/openrun:${OPENRUN_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      OPENRUN_PASSWORD: ${OPENRUN_PASSWORD:?Set OPENRUN_PASSWORD (12+ characters) in .env}
    ports:
      - "${OPENRUN_PORT:-8000}:8000"
    volumes:
      - openrun-data:/data
    deploy:
      resources:
        limits:
          memory: 512m
volumes:
  openrun-data:
