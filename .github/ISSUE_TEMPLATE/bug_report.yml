name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't include passwords, tokens or personal health data. Security issues go through the Security tab, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Click …\n3. See …"
  - type: dropdown
    id: setup
    attributes:
      label: How do you run OpenRun?
      options: [Docker / Docker Compose, ./run.sh on my computer, Server (Coolify, Caddy, …), MCP server only, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or the commit hash
  - type: input
    id: env
    attributes:
      label: Browser / device / watch
      placeholder: Safari on iPhone 15 (iOS 26), Forerunner 265
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server log lines (`docker logs` or `~/.openrun/server.log`) or the browser console. Remove personal data.
      render: text
