[project]
name = "openrun"
version = "0.2.0"
description = "Open-source, evidence-based running coach: training plans, Garmin sync, HRV readiness and an AI coach"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E731", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
